name: CI alerts
on:
  workflow_run:
    workflows: ["Rust"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-incident-notifications
  cancel-in-progress: false
jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Notify failure or recovery
        uses: gigpies/gigpies/.github/actions/ci-alerts@47be1e2e4ad3064669e47507774117ddf32ad0bb
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          recipient: PaolaShultz
