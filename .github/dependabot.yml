version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
    # The shared ci-alerts action is pinned to a gigpies commit, so every gigpies
    # push looks like a new release. Bump it by hand when the action changes.
    ignore:
      - dependency-name: 'gigpies/gigpies*'
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      rust-compatible:
        update-types: [minor, patch]
